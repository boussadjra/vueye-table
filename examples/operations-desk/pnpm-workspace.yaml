# An independent npm consumer: never resolve the repository's workspace packages.
packages:
  - .
linkWorkspacePackages: false
preferWorkspacePackages: false
autoInstallPeers: true
strictPeerDependencies: true
minimumReleaseAge: 0
overrides:
  "minimatch@>=7 <11.0.1": 11.0.1
  "glob@>=9 <14.0.2": 14.0.2
  "simple-git@<4.0.1": 4.0.1
  "@simple-git/argv-parser@<2.0.1": 2.0.1
  "node-forge@<1.4.1": 1.4.1
  "undici@>=8 <8.12.2": 8.12.2
  "seroval@>=1.6 <1.6.11": 1.6.11
  "serialize-javascript@<7.1.3": 7.1.3
allowBuilds:
  esbuild: true
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
